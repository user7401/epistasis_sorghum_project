name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint and unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R package dependencies
        shell: Rscript {0}
        run: |
          install.packages(c("testthat", "future.apply", "lintr"))

      - name: Syntax-check all R scripts
        shell: Rscript {0}
        run: |
          files <- list.files("scripts", pattern = "\\.[Rr]$", recursive = TRUE, full.names = TRUE)
          ok <- TRUE
          for (f in files) {
            parsed <- tryCatch({ parse(f); TRUE },
                               error = function(e) {
                                 message("Parse error in ", f, ": ", conditionMessage(e))
                                 FALSE
                               })
            ok <- ok && parsed
          }
          if (!ok) stop("One or more scripts failed to parse")
          message("All ", length(files), " R scripts parsed successfully")

      - name: Run unit tests
        shell: Rscript {0}
        run: |
          library(testthat)
          testthat::test_dir("tests/testthat", stop_on_failure = TRUE)

      - name: Lint (informational)
        shell: Rscript {0}
        run: |
          lints <- lintr::lint_dir("scripts")
          print(lints)
          message("lintr reported ", length(lints), " style note(s)")
